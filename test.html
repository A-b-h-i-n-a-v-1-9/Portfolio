<!DOCTYPE html>
<html>
  <body style="
    margin:0;
    padding:0;
    background:#ffffff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#0f172a;
  ">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:48px 16px;">
      <tr>
        <td align="center">

          <!-- Container -->
          <table width="100%" cellpadding="0" cellspacing="0" style="
            max-width:640px;
            background:#ffffff;
            border-radius:16px;
            box-shadow:0 16px 40px rgba(0,0,0,0.06);
            overflow:hidden;
          ">

            <!-- Header -->
            <tr>
              <td style="padding:40px 48px 24px;">
                <h1 style="
                  margin:0;
                  font-size:26px;
                  font-weight:600;
                  line-height:1.3;
                  letter-spacing:-0.02em;
                ">
                  New contact submission
                </h1>
              </td>
            </tr>

            <!-- Meta -->
            <tr>
              <td style="padding:0 48px 24px;font-size:14px;color:#475569;">
                <p style="margin:0;">
                  You’ve received a new message from your portfolio terminal.
                </p>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding:0 48px;">
                <div style="height:1px;background:#e5e7eb;"></div>
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding:32px 48px;">
                <p style="
                  margin:0 0 8px;
                  font-size:13px;
                  color:#64748b;
                  text-transform:uppercase;
                  letter-spacing:0.06em;
                ">
                  Sender email
                </p>
                <p style="
                  margin:0 0 20px;
                  font-size:15px;
                  font-weight:500;
                ">
                  {{USER_EMAIL}}
                </p>

                <p style="
                  margin:0 0 8px;
                  font-size:13px;
                  color:#64748b;
                  text-transform:uppercase;
                  letter-spacing:0.06em;
                ">
                  Message
                </p>

                <div style="
                  background:#f8fafc;
                  border-radius:12px;
                  padding:18px;
                  font-size:14px;
                  line-height:1.6;
                  color:#334155;
                  white-space:pre-wrap;
                ">
                  {{MESSAGE}}
                </div>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:32px 48px 40px;font-size:13px;color:#94a3b8;">
                Delivered securely via Web3Forms · Portfolio Terminal
              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
